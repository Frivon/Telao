<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Telão Tropical City</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div id="player"></div></div>

<section id="idle" class="layer">
  <svg class="palm" viewBox="0 0 120 160" aria-hidden="true">
    <path d="M60 158 C58 110 62 80 66 50" stroke="#FF7A00" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M66 50 C40 28 18 36 6 56 C28 44 46 44 66 50Z M66 50 C90 24 112 30 118 52 C98 42 82 44 66 50Z M66 50 C58 22 64 8 78 0 C74 20 72 34 66 50Z M66 50 C44 44 30 62 28 84 C42 66 54 58 66 50Z M66 50 C88 46 100 64 100 86 C88 68 76 58 66 50Z" fill="#FF7A00"/>
  </svg>
  <h1>Tropical City</h1>
  <p id="idleMsg">Sem transmissão</p>
  <div class="waves"><i></i><i></i><i></i></div>
</section>

<section id="hud" class="layer hidden"><b id="hudTitle"></b></section>
<div id="pausebadge" class="hidden">Pausado</div>

<section id="test" class="layer hidden">
  <div class="bars"><i style="background:#FF7A00"></i><i style="background:#FFB000"></i><i style="background:#F2F2F2"></i><i style="background:#8C8C8C"></i><i style="background:#333"></i><i style="background:#000"></i></div>
  <div class="edge top">▲ topo</div><div class="edge bottom">▼ base</div>
  <div class="edge left">◀ esquerda</div><div class="edge right">direita ▶</div>
  <div class="center"><h2>Teste de tela</h2><p id="testInfo"></p><p id="clock"></p></div>
</section>

<script src="player.js"></script>
</body>
</html>
